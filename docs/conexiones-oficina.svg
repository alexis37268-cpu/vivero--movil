<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="754" viewBox="0 0 1600 754" font-family="Arial, Helvetica, sans-serif">
<rect width="1600" height="754" fill="#fff"/>
<text x="60" y="62" font-size="32" font-weight="bold" fill="#1b2a20">Vivero Sol Puntano — Oficina (ESP8266 NodeMCU + LoRa)</text>
<text x="60" y="96" font-size="18" fill="#55645a">NodeMCU ESP8266 + LoRa Ra-02 433 MHz + LCD 16x2 I2C + LED de error. Sube los hibernáculos al broker por WiFi.</text>
<rect x="60" y="140" width="260" height="414" rx="14" fill="#20303a"/>
<text x="190" y="180" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">NodeMCU</text>
<text x="190" y="206" font-size="15" fill="#cfd8dc" text-anchor="middle">ESP8266 - oficina</text>
<text x="305" y="186" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">3V3</text>
<circle cx="320" cy="180" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 180 H760" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="180" r="6" fill="#d32f2f"/>
<text x="780" y="186" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#d32f2f">LoRa Ra-02</tspan>  3.3V (¡solo 3,3 V!)</text>
<text x="305" y="220" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">VIN (5 V)</text>
<circle cx="320" cy="214" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 214 H760" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="214" r="6" fill="#d32f2f"/>
<text x="780" y="220" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#d32f2f">LCD 16x2</tspan>  VCC</text>
<text x="305" y="254" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">GND</text>
<circle cx="320" cy="248" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 248 H760" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="248" r="6" fill="#111111"/>
<text x="780" y="254" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#111111">GND común</tspan>  Ra-02 GND, LCD GND, LED de error</text>
<text x="305" y="288" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D5</text>
<circle cx="320" cy="282" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 282 H760" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="282" r="6" fill="#ef6c00"/>
<text x="780" y="288" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#ef6c00">LoRa Ra-02</tspan>  SCK</text>
<text x="305" y="322" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D6</text>
<circle cx="320" cy="316" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 316 H760" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="316" r="6" fill="#ef6c00"/>
<text x="780" y="322" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#ef6c00">LoRa Ra-02</tspan>  MISO</text>
<text x="305" y="356" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D7</text>
<circle cx="320" cy="350" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 350 H760" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="350" r="6" fill="#ef6c00"/>
<text x="780" y="356" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#ef6c00">LoRa Ra-02</tspan>  MOSI</text>
<text x="305" y="390" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D8</text>
<circle cx="320" cy="384" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 384 H760" stroke="#ef6c00" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="384" r="6" fill="#ef6c00"/>
<text x="780" y="390" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#ef6c00">LoRa Ra-02</tspan>  NSS</text>
<text x="305" y="424" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D2</text>
<circle cx="320" cy="418" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 418 H760" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="418" r="6" fill="#6a1b9a"/>
<text x="780" y="424" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#6a1b9a">LCD 16x2 I2C</tspan>  SDA</text>
<text x="305" y="458" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D1</text>
<circle cx="320" cy="452" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 452 H760" stroke="#6a1b9a" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="452" r="6" fill="#6a1b9a"/>
<text x="780" y="458" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#6a1b9a">LCD 16x2 I2C</tspan>  SCL</text>
<text x="305" y="492" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">D0</text>
<circle cx="320" cy="486" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 486 H760" stroke="#00838f" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="486" r="6" fill="#00838f"/>
<text x="780" y="492" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#00838f">LED de ERROR</tspan>  + resistencia 330 Ω → GND</text>
<text x="305" y="526" font-size="17" font-weight="bold" fill="#fff" text-anchor="end">FLASH</text>
<circle cx="320" cy="520" r="7" fill="#d9d9d9" stroke="#555" stroke-width="2"/>
<path d="M327 520 H760" stroke="#b8860b" stroke-width="5" stroke-linecap="round"/>
<circle cx="760" cy="520" r="6" fill="#b8860b"/>
<text x="780" y="526" font-size="17" fill="#1b2a20"><tspan font-weight="bold" fill="#b8860b">Botón de la placa</tspan>  toque = siguiente estación · 5 s = portal WiFi</text>
<rect x="60" y="584" width="720" height="134" rx="10" fill="#f4f7f4" stroke="#cfd8d1" stroke-width="2"/>
<text x="80" y="614" font-size="16" fill="#1b2a20">Arduino IDE: placa NodeMCU 1.0 (ESP-12E Module). Abrir firmware/oficina/oficina.ino</text>
<text x="80" y="640" font-size="16" fill="#1b2a20">secrets.h: clave del broker. ca_cert.h: el mismo certificado del vivero</text>
<text x="80" y="666" font-size="16" fill="#1b2a20">Librerías: LoRa, LiquidCrystal I2C, PubSubClient, WiFiManager</text>
<text x="80" y="692" font-size="16" fill="#1b2a20">WiFi: red &quot;Vivero-oficina&quot; desde el celular (igual que el vivero)</text>
<rect x="800" y="584" width="740" height="160" rx="10" fill="#fff6e5" stroke="#f0d59a" stroke-width="2"/>
<text x="820" y="614" font-size="16" font-weight="bold" fill="#7a5200">Antes de enchufar:</text>
<text x="820" y="640" font-size="16" font-weight="normal" fill="#7a5200">Ra-02 a 3,3 V. A 5 V se quema. Siempre con antena.</text>
<text x="820" y="666" font-size="16" font-weight="normal" fill="#7a5200">LCD a 5 V: conversor de nivel I2C o sacar sus pull-up.</text>
<text x="820" y="692" font-size="16" font-weight="normal" fill="#7a5200">Si con el Ra-02 en D8 la placa no arranca, avisar:</text>
<text x="820" y="718" font-size="16" font-weight="normal" fill="#7a5200">se cambia el NSS de pin.</text>
</svg>