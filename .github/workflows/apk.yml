name: Compilar APK
on:
  push:
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar
        run: |
          npm install
          node prueba-clima/prueba.js   # el lector de clima tiene que andar antes de compilar
          node armar-www.js
          pip install pillow
          python3 icono.py
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FFFFFF' || echo sin iconos
          npx cap sync android
          python3 parche-android.py
      - name: Compilar
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../vivero-sol-puntano.apk
      - name: Revisar el APK (revisor de clima adentro y permisos)
        run: |
          unzip -l vivero-sol-puntano.apk | grep -q 'assets/public/runners/clima.js' && echo "OK revisor de clima adentro"
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt
          $AAPT dump permissions vivero-sol-puntano.apk | tee permisos.txt
          grep -q POST_NOTIFICATIONS permisos.txt && grep -q REQUEST_IGNORE_BATTERY_OPTIMIZATIONS permisos.txt && echo "OK permisos de avisos"
          if grep -q LOCATION permisos.txt; then echo "MAL: quedo un permiso de ubicacion"; exit 1; else echo "OK sin permisos de ubicacion"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Vivero Sol Puntano
          body: Bajá vivero-sol-puntano.apk desde el celu y abrilo para instalar.
          files: app/vivero-sol-puntano.apk
          make_latest: true
