name: Compilar APK
on:
  push:
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar
        run: |
          npm install
          node armar-www.js
          pip install pillow
          python3 icono.py
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#2F7D4A' --splashBackgroundColor '#2F7D4A' || echo sin iconos
          npx cap sync android
          python3 parche-android.py
      - name: Compilar
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../vivero-domovil.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Vivero DoMoVil
          body: Bajá vivero-domovil.apk desde el celu y abrilo para instalar.
          files: app/vivero-domovil.apk
          make_latest: true
