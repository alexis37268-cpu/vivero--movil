# Robot de alertas meteorologicas del SMN para el vivero.
# APAGADO: por ahora las alertas las revisa la app del celular (runner-clima.js).
# Para que el ESP cierre el venteo solo con alertas, volver a poner el horario:
#   schedule:
#     - cron: '*/15 * * * *'
# y cargar MQTT_USER / MQTT_PASS en los Secrets (ver README).
name: Alertas SMN
on:
  workflow_dispatch:
  push:
    paths: ['robot/**', '.github/workflows/alertas.yml']
concurrency:
  group: alertas-smn          # nunca dos a la vez (el SMN limita los pedidos)
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  alertas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "paho-mqtt>=2,<3"
      - name: Probar el lector con avisos guardados
        run: python3 robot/prueba_alertas.py
      # Cache: los avisos ya leidos no se vuelven a bajar (cuida el limite del SMN)
      - uses: actions/cache/restore@v4
        with:
          path: cache-alertas.json
          key: alertas-${{ github.run_id }}
          restore-keys: alertas-
      - name: Leer el SMN y publicar
        env:
          VIVERO_LAT: ${{ vars.VIVERO_LAT }}
          VIVERO_LON: ${{ vars.VIVERO_LON }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
        run: python3 robot/alertas_smn.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: cache-alertas.json
          key: alertas-${{ github.run_id }}
